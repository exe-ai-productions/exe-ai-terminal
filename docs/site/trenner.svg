<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 6" width="1080" height="6">
  <!-- The four-band divider: one colour per skin, softly blended. -->
  <defs>
    <linearGradient id="baender" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e96c6"/>
      <stop offset=".33" stop-color="#7d6cba"/>
      <stop offset=".66" stop-color="#b1a687"/>
      <stop offset="1" stop-color="#8f8e86"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="6" rx="3" fill="url(#baender)" fill-opacity="0.6"/>
</svg>
